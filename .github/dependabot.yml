# Dependabot 設定 — 依賴自動更新
#
# 目的:依賴漏洞/過期不再靠人記得;Dependabot 每週開 PR、既有 CI
# (gitleaks + audit gate + 測試)當升級安全網。
#
# ⚠️ 若你的開發主線不是預設分支(例如 main=正式、develop=開發主線),
#    每個 update 條目要加 `target-branch: 'develop'`,否則升級 PR 會開到預設分支。
#
# 群組策略:minor + patch 合併成單一群組 PR(防 PR 洪水,一次 CI 驗一批);
# major 個別開(breaking change 要逐個評估)。

version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 3
    commit-message:
      prefix: '依賴'
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # `@types/node` 的 major 要對齊 **package.json `engines.node` 的下限**,不是追最新。
      # 理由:types 比 runtime 新 → 程式碼可以 typecheck 過,但那個 API 在實際 runtime
      # 根本不存在(例:CI 跑 Node 22,裝 @types/node 26 就能寫出 Node 26 才有的 API 而不報錯)。
      # 這條是「教訓 → 機器」:2026-07-25 dependabot 推了 20 → 26,人工判斷後改釘 ^22,
      # 為了不靠下次還記得,直接把規則寫進機器。
      # **升 engines.node 時,手動把這個 major 一起升**(兩者是同一個決定的兩面)。
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # `typescript` 的 major 受 **typescript-eslint 的 peer 範圍**節制,不能自己先跑。
      # 2026-07-25 實測:TS 7.0.2 讓 `npm ci` 直接失敗(不是 lint 壞而已)——
      #   npm error Conflicting peer dependency: typescript@6.0.3
      #   npm error   peer typescript@">=4.8.4 <6.1.0" from typescript-eslint@8.65.0
      # 光關掉 PR 沒用,dependabot 下個週期會再開一次、再燒一輪 CI、再要人判斷一次。
      # **解除條件**(升 major 前先跑這行確認涵蓋新 major):
      #   npm view typescript-eslint peerDependencies.typescript
      # 涵蓋了就把本條移除、同批升 typescript 與 typescript-eslint。minor/patch 不受影響。
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 2
    commit-message:
      prefix: '依賴'
