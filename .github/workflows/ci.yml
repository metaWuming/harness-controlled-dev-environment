name: CI

# 品質閘門(L1 通用版):
#   secret scan(gitleaks 全史)→ typecheck → lint → audit → 文件引用自檢 →
#   TODOS marker 治理 → 去識別化掃描 → vitest
#
# 🔴 兩條「歷史掃描」政策獨立、不可混淆:
#   ① Secret scan(gitleaks):**全史**掃 secrets(commit/blob/msg 一律嚴格)——
#      密鑰洩露隨時是 blocker、沒有 grandfather 空間。
#   ② Source-term scan(去識別化):**baseline..HEAD** 掃 blob(current tree 仍
#      永遠嚴格;baseline 及更早的去識別化 debt 用 machine-readable baseline
#      grandfather,不重寫公開歷史)。baseline 由 scripts/source-term-baseline.json
#      落地(schemaVersion + SHA);loader 與 validator 在 scripts/check-no-source-terms.ts
#      (fail-closed on 40-hex / rev-parse / ancestor 三檢查)。
#   兩者共用 gitleaks binary/CI step 是**巧合**、不是政策合流;文件敘述、修法規範
#   都要分開對待(正本:docs/architecture/source-term-history-baseline.md
#   「政策邊界:source-term 掃描 vs gitleaks 秘密掃描」)。
#
# 本模板無 DB / 無框架 build;若你採 Next.js+Prisma 堆疊,把
# stack/nextjs-prisma/ci-snippets/prisma-ci-steps.yml 的步驟插進來
# (postgres service + prisma generate + migrate/seed + schema refs check)。
#
# 任何一步失敗就擋 PR。建議設 GitHub branch protection:主線分支要求 CI pass 才能 merge。

on:
  # 🔴 Codex batch 6 round 4 P2:branch filter 需涵蓋所有常見 default_branch 命名。
  # workflow 底下的 `if: … default_branch …` 若 event filter 在更上層就把該 branch 過濾掉、
  # 整個 workflow 都不會觸發、動態條件形同虛設。列常見 delivery branch names
  # (main / master / trunk / develop);導入者若用其他命名(release、prod、production 等),
  # 依 docs/ADOPTION 也需同步更新這裡與 workflow 內 `if:` 條件。
  push:
    branches: [main, master, trunk, develop, 'feature/**']
  pull_request:
    branches: [main, master, trunk, develop]

# 同一 PR / branch 的舊 run 自動取消,省 CI 分鐘
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小權限原則:不宣告時 GITHUB_TOKEN 吃 repo 預設(舊 repo 常是 read-write 全開)。
# 本 workflow 只需要讀取程式碼 — 顯式收斂成 contents: read,讓「被注入的第三方 action
# 或惡意依賴拿 token 去寫 repo」這條路直接斷掉。
# 若之後加了需要寫入的 step(留 PR comment / 推 release / 更新 badge),
# 在「那個 job」單獨加它需要的權限,不要放寬這裡的全域預設。
permissions:
  contents: read

# 🔴 批 10:workflow-level DELIVERY_REFS 常數(SSOT、擋兩處 env 值漂)。
# TODOS Markers Check + Source-term scan 兩 step 都用此常數當「delivery-refs
# 白名單」(即哪些 remote branch 上的 merged commits 可算作「本 repo 已 merge
# PR 證據」)。過去兩處 step-level env 各自定義,批 9 Step 5 F-round23-4 抓到
# 「未來翻該值時只翻一處會漂」漏洞。集中在 workflow-level 一份 SSOT 解決。
#
# 🔴 批 10 D0 拍板 policy A:只傳 `origin/${default_branch}`,不含 `origin/develop`。
# 理由(見批 10 plan file 詳述):
#   - 本 harness template 本身 main-only、應遵守 main-only 預設
#   - Legacy develop 誤放行是隱性 false negative(比 GitFlow 假紅嚴重)
#   - GitFlow importer 客製此 workflow yml 覆蓋常數即可(合理成本)
# 批 9 Codex round 2 vs round 3 對此 pre-existing 兩難各抓一半、
# Owner 拍板 A(統一方向)、跨兩 step 對齊。
env:
  DELIVERY_REFS: origin/${{ github.event.repository.default_branch }}
  # 🔴 批 10 Step 5 F1(conf 7):MARKER_SELF_PR 也提到 workflow-level(同 SSOT 論證延伸)。
  # 兩 step 的 MARKER_SELF_PR 都寫 `${{ github.event.pull_request.number }}`——
  # 未來若換表達式(如 `github.event.number`)只要漏改一處,兩 script 拿到不同
  # self-PR 值,正是批 10 想擋的漂移。集中在 workflow-level SSOT 一份。
  # non-PR event(push / schedule / workflow_dispatch)展開為空字串 → 兩 script
  # 的 acknowledgeSelfPr("") 都回 null,對其他不需要它的 step 也無害。
  MARKER_SELF_PR: ${{ github.event.pull_request.number }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        # SHA-pin(不用可變 tag):tag 可被重新指向,SHA 不行 — 這是 Actions 供應鏈
        # 攻擊的標準入口。與下方 gitleaks binary 的 pinned version + sha256 同一套姿態。
        # 升版由 dependabot(github-actions ecosystem,monthly)開 PR 自動改 SHA + 註解 tag。
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # fetch-depth: 0 = 全史:gitleaks 全史掃描、check-todos-markers 的 PR merge
          # 證據查找、check-no-source-terms 的歷史 blob 掃描都需要
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        # 常駐秘密掃描:對全 git 歷史跑 gitleaks — 任何密鑰進到 PR 就紅,不等事後健檢。
        # 誤報放行走 repo 根目錄 .gitleaks.toml(按值精準放行,見該檔原則註解)。
        # pinned 官方 release binary + sha256 校驗(不用第三方 action,少一個供應鏈依賴;
        # 升版:改 VERSION + 對照 release 頁 checksums.txt 更新 SHA)。
        run: |
          GITLEAKS_VERSION=8.30.1
          GITLEAKS_SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner

      - name: Setup Node 22
        # 同上 SHA-pin。node-version 要與 package.json 的 engines.node 對齊,
        # 否則本機跑得過、CI 紅(或更糟:兩邊行為不同但都綠)。
        # engines 是 >=22.13.0(eslint 10 的實際下限是 ^22.13.0,不是 ^22);
        # setup-node 的 '22' 會解析到 22.x 最新,滿足該下限。
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Dependency audit (high/critical 硬 gate)
        # --audit-level=high → 只有 high/critical 讓 CI 紅,moderate/low 照樣印在 log
        # (可見、不擋 — 中低風險 CVE 修復常需 major bump / 等 upstream,不該卡住所有
        # merge;高風險則必須當下處理)。本模板全 devDeps,不加 --omit=dev。
        run: npm audit --audit-level=high

      - name: Doc Refs Check
        # 一致性維護:掃 harness 文件的「檔案引用」是否指向真實存在的檔案。
        # 新失效引用 → CI 紅,逐條 triage(檔案搬移 → 改路徑;已刪 → 補 superseded 註記)。
        run: npx tsx scripts/check-doc-refs.ts

      - name: Doc Size Check
        # 記錄檔肥大守門:模板附帶的每次開工必讀檔(progress.md、LESSONS.md)超過
        # 額度 → CI 紅。預設 20/60 KB 是刻意寬鬆的成熟專案 headroom ceiling、
        # 不是模板現況 × 1.2-1.6;導入者建立自己的專案後,應依預計常態大小
        # × 1.2-1.6 重算並寫下調整理由。**調整必須寫下理由**——無聲調高就是
        # 把閘門關掉(該檔頭 + `tests/check-doc-size.test.ts` 已把「額度數字釘住」機器化)。
        run: npx tsx scripts/check-doc-size.ts

      - name: Fetch delivery refs (for TODOS Markers Check)
        # check-todos-markers 用主線分支的 git 史判 PR merge 證據;pull_request event 下
        # checkout 是 detached merge ref,顯式 fetch 建 remote-tracking ref(best-effort:
        # 分支不存在時略過,腳本會退回 HEAD)
        # 🔴 Delivery-branch 白名單:PR event 一律跑;push event 只在**進 delivery branch
        # 之後**跑(此時 PR 已 squash merge、self-PR 引用找得到 merge 證據、不會踩死鎖)。
        # 非 delivery branch 的 push(feature/* fix/* chore/* release/* …)一律 skip——
        # 那時 PR 通常還沒 merge、self-PR 引用會找不到證據。
        # `default_branch` 動態抓,自動涵蓋 main / master / trunk 等 repo 主線命名;
        # 對 GitFlow 專案的 `develop` 明列補齊。
        # 🔴 導入者注意:若你的 delivery branch 不是 default_branch 或 develop(例:
        # `release/**`),同步把它加進下面的條件,否則 mainline push 的 marker 治理
        # 會被靜默跳過(Codex batch 6 round 3 P2)。
        if: github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.ref == 'refs/heads/develop'
        # 🔴 Codex batch 6 round 6 P2 + Step 5 #6/#8:改用 default_branch 動態抓 +
        # `git remote set-head` 讓 origin/HEAD 指向 default,check-todos-markers 走
        # origin/HEAD 唯一權威來源、不再無條件 resolve master/trunk 造成 legacy branch
        # 假通過。額外 delivery branch 導入者透過 env `DELIVERY_REFS` 加(見 script)。
        # env 傳 default_branch(不用 shell string interpolation),避免罕見的
        # branch 名含 shell metacharacter 情境;若 set-head 失敗仍有 env 提供 fallback。
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH" || echo "note: $DEFAULT_BRANCH ref fetch 略過"
          git remote set-head origin -a || echo "note: origin/HEAD set-head 略過"
          git fetch --no-tags origin develop:refs/remotes/origin/develop || echo "note: develop ref fetch 略過(未採 develop 主線則屬正常)"

      - name: TODOS Markers Check
        # marker 治理:TODOS.md 完成宣稱(✅/完工)必須引用有 merge 證據的 PR 號,
        # 防打錯號 / 投機性標 ✅。MARKER_SELF_PR 解「同 PR 翻 marker 引用本 PR」死鎖。
        # 🔴 Delivery-branch 白名單:PR event 一律跑;push event 只在**進 delivery branch
        # 之後**跑(此時 PR 已 squash merge、self-PR 引用找得到 merge 證據、不會踩死鎖)。
        # 非 delivery branch 的 push(feature/* fix/* chore/* release/* …)一律 skip——
        # 那時 PR 通常還沒 merge、self-PR 引用會找不到證據。
        # `default_branch` 動態抓,自動涵蓋 main / master / trunk 等 repo 主線命名;
        # 對 GitFlow 專案的 `develop` 明列補齊。
        # 🔴 導入者注意:若你的 delivery branch 不是 default_branch 或 develop(例:
        # `release/**`),同步把它加進下面的條件,否則 mainline push 的 marker 治理
        # 會被靜默跳過(Codex batch 6 round 3 P2)。
        if: github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.ref == 'refs/heads/develop'
        # 🔴 批 10:DELIVERY_REFS + MARKER_SELF_PR 都繼承 workflow-level env
        # (見檔頭 `env:` 區塊)、無需 step-level 覆蓋。policy A 拍板統一「只
        # default_branch」+ SSOT 擋兩處值漂(批 9 F-round23-4 / 批 10 F1)。
        run: npx tsx scripts/check-todos-markers.ts

      - name: Source-term scan (de-identification gate)
        # 去識別化常駐 gate:本模板抽取自私有專案,掃「來源專案識別詞」殘留
        # (working tree + git history)。導入者不需要時可連同 scripts/deny-terms.txt 移除。
        #
        # 🔴 PR A1(正本:docs/architecture/source-term-history-baseline.md
        # 「掃描範圍與三種 repo 情境」):history 掃描
        # 走 **baseline cutover** 語意——scripts/source-term-baseline.json 記錄
        # 主線當下 HEAD SHA,checker 用 `rev-list baseline..HEAD` 只掃 baseline
        # **之後**的歷史;baseline 及更早的去識別化 debt 一律 grandfather(不重寫
        # 公開歷史)。current tree scan 永遠嚴格、baseline 影響不到。
        #
        # baseline 更新是**治理決策**,不是隨手翻的常數:改 scripts/source-term-baseline.json
        # 要走 PR + Owner 拍板;downstream fork 未建 config 檔 → checker 沿用舊
        # 全史掃描(D3/D4 向下相容,見 scripts/check-no-source-terms.ts
        # loadBaselineConfig docstring)。
        #
        # 🔴 與 Secret scan (gitleaks) 是**兩條獨立政策**(見檔頭註解):gitleaks
        # 掃 secrets 全史嚴格、沒有 grandfather;source-term 掃去識別化名詞用
        # baseline cutover 讓主線可自證。兩者共用 CI 步驟純巧合,別在文件裡合稱
        # 「全史 no leaks」——那會把兩個 policy 語意合流誤導讀者。
        #
        # 🔴 批 7 R3-4 → 批 10 收:step-level env 不會跨 step 傳遞(pre-existing 事實),
        # 但 workflow-level env 會自動繼承——批 10 把 DELIVERY_REFS 提到 workflow-level
        # (見檔頭 `env:` 區塊)後,本 step 無需顯式再設。批 7 註記的「顯式列出所有
        # delivery refs」考量已改由 workflow-level SSOT 承接(擋兩處值漂,
        # 批 9 Step 5 F-round23-4)。
        #
        # 🔴 批 10 D0 policy A:workflow-level env 只 default_branch、不含 develop。
        # 批 7 R3-4 曾在此 step 加 `,origin/develop` 解 GitFlow-only PR 誤擋,但
        # 批 9 Codex round 2 抓到「main-only 專案 legacy develop 誤放行」反面問題——
        # 跨兩 step 相反選擇是 pre-existing 兩難,Owner 批 10 拍板 A(見檔頭註解)。
        #
        # 🔴 批 8 Phase B:MARKER_SELF_PR 解 sprint 內 self-reference 死鎖。
        # 完整契約與範圍見 scripts/check-no-source-terms.ts 的 loadAllowedPrs
        # docstring(SSOT)——本註解僅點名該 env 用途,不重述細節。
        # 命名對齊上方 TODOS Markers Check step 的既有 env(批 6 加的)。
        #
        # 🔴 批 9 Phase A(批 8 F4 收):Delivery-branch 白名單——PR event 一律跑;
        # push event 只在進 delivery branch 之後跑(此時 PR 已 squash merge、
        # self-PR 引用有 merge 證據)。非 delivery branch 的 push(feature/* / fix/* /
        # chore/* / release/* …)一律 skip——那時 PR 通常還沒 merge、
        # `github.event.pull_request.number` 為 null(env 空字串)、MARKER_SELF_PR
        # 通道失效 → self-PR 引用找不到證據被誤擋。gate pattern 對齊上方 TODOS
        # Markers Check step 既有寫法(批 6 加的)、涵蓋 main/master/trunk 等 repo
        # 主線命名 + GitFlow 的 develop。
        # 🔴 導入者注意:若你的 delivery branch 不是 default_branch 或 develop
        # (例:release/**),同步把它加進下面的條件——與 TODOS Markers Check 三處
        # 同步紀律(批 6 LESSONS L89)。
        if: github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.ref == 'refs/heads/develop'
        # 🔴 批 10:DELIVERY_REFS + MARKER_SELF_PR 都繼承 workflow-level env
        # (見檔頭 `env:` 區塊)、無需 step-level 覆蓋(F1 修法)。
        run: npm run check:no-source-terms

      - name: Test (vitest)
        run: npx vitest run
